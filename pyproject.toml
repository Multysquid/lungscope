[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lungscope"
version = "0.1.0"
description = "Interactive visualization of reduced lung simulations and uncertainty studies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.11,<4",
    "numpy>=2.5,<3",
    "plotly>=7.1,<8",
    "pyvista>=0.49,<0.50",
    "trame>=3.13,<4",
    "trame-plotly>=3.1,<4",
    "trame-pyvista>=0.3,<0.4",
    "trame-vtk>=2.11,<3",
    "trame-vuetify>=3.2,<4",
    "vtk>=9.3,<10",
    "xarray>=2026.9",
]

[dependency-groups]
dev = ["pytest>=9.2,<10"]

[project.scripts]
lungscope = "lungscope.app:main"

[project.urls]
Repository = "https://github.com/bgoderbauer/lungscope"

[tool.setuptools.packages.find]
where = ["src"]
